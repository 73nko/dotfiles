# Alacritty Configuration
# Tokyo Night Theme with Neon Magenta/Cyan Accents

[general]
working_directory = "None"

[terminal.shell]
program = "/opt/homebrew/bin/fish"

# Window configuration
[window]
decorations = "buttonless"
dynamic_title = true
opacity = 0.85
title = "Alacritty"
startup_mode = "Windowed"
padding = { x = 3, y = 5 }

# Font configuration
[font]
size = 14.0
# Operator Mono Lig (Active el comentario para volver a usarla, pero necesitarás una versión "Nerd Font" para los iconos)
# normal = { family = "Operator Mono Lig" }
# bold = { family = "Operator Mono Lig", style = "Bold" }
# italic = { family = "Operator Mono Lig", style = "Italic" }
# bold_italic = { family = "Operator Mono Lig", style = "Bold Italic" }

# JetBrainsMono Nerd Font (Instalada y funciona con iconos)
normal = { family = "JetBrainsMono Nerd Font" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# Cursor configuration
[cursor]
style = "Block"
unfocused_hollow = true

# Scrolling configuration
[scrolling]
history = 10000
multiplier = 3

# Selection configuration
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# Bell configuration
[bell]
animation = "EaseOutExpo"
duration = 0
color = "#ffffff"

# Keyboard configuration
[keyboard]
[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Command"

[[keyboard.bindings]]
action = "Quit"
key = "W"
mods = "Command"

[[keyboard.bindings]]
action = "CreateNewWindow"
key = "N"
mods = "Command"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Command"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Command"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Command"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Command"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "0"
mods = "Command"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mods = "Shift"

# Alacritty mappings to enable Mac-style word and line deletion in the shell.

[[keyboard.bindings]]
key = "Backspace"
mods = "Command"
chars = "\u0015" # CORRECTED: Sends Ctrl+U, bound to 'backward-kill-line'

[[keyboard.bindings]]
key = "Backspace"
mods = "Alt" # Maps to the macOS Option (Opt) key
chars = "\u0017" # CORRECTED: Sends Ctrl+W, bound to 'backward-kill-word'

# Nebula Theme
[colors.primary]
background = "#0D0F1E"
foreground = "#CDD6F4"

[colors.cursor]
text = "#0D0F1E"
cursor = "#FF79C6"

[colors.selection]
text = "#CDD6F4"
background = "#252840"

[colors.normal]
black   = "#11142B"
red     = "#F48FB1"
green   = "#A6E3A1"
yellow  = "#F9E2AF"
blue    = "#7AB9F5"
magenta = "#BD93F9"
cyan    = "#4DD0E1"
white   = "#CDD6F4"

[colors.bright]
black   = "#2A2F4A"
red     = "#FF79C6"
green   = "#C3E88D"
yellow  = "#FAB387"
blue    = "#89B4FA"
magenta = "#CBA6F7"
cyan    = "#89DCEB"
white   = "#FFFFFF"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
