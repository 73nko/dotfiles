# Tokyo Night Theme - Neon Magenta/Cyan Accents
# Custom theme for Helix matching Neovim/Cursor/Alacritty/Tmux/Starship

[palette]
# Backgrounds
"bg" = "#0d0f18"           # Cosmic Dark Purple/Black
"bg-dark" = "#090a10"      # Even darker for sidebars/status
"bg-highlight" = "#1a1d2e" # Cursor line background
"bg-float" = "#0d0f18"     # Floating windows

# Foregrounds
"fg" = "#c0caf5"        # Main text
"fg-dark" = "#a9b1d6"   # Dimmed text
"fg-darker" = "#828bb8" # Very dimmed text
"fg-gutter" = "#565f89" # Line numbers, gutter

# Accents
"magenta" = "#ff00ff" # Neon Magenta
"cyan" = "#00ffff"    # Bright Cyan/Blue
"blue" = "#7aa2f7"    # Blue
"purple" = "#bd00ff"  # Deep Purple
"green" = "#9ece6a"   # Green
"red" = "#f7768e"     # Red
"yellow" = "#e0af68"  # Yellow
"orange" = "#ff9e64"  # Orange

# Special
"comment" = "#565f89"      # Comments
"selection" = "#3d0c45"    # Selection background
"border" = "#2f0e3b"       # Border color
"soft-magenta" = "#ff6ec7" # Soft magenta for errors

# UI
"ui.background" = { bg = "bg-dark" }
"ui.background.separator" = "fg-gutter"
"ui.cursor" = { fg = "bg", bg = "magenta" }
"ui.cursor.normal" = { fg = "bg", bg = "magenta" }
"ui.cursor.insert" = { fg = "bg", bg = "cyan" }
"ui.cursor.select" = { fg = "bg", bg = "purple" }
"ui.cursor.match" = { fg = "bg", bg = "cyan" }
"ui.cursorline.primary" = { bg = "bg-highlight" }
"ui.cursorline.secondary" = { bg = "bg-highlight" }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.linenr" = { fg = "fg-gutter" }
"ui.linenr.selected" = { fg = "magenta", modifiers = ["bold"] }
"ui.statusline" = { fg = "fg", bg = "bg-dark" }
"ui.statusline.normal" = { fg = "fg", bg = "bg-dark", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg-dark", bg = "cyan", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg-dark", bg = "purple", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "magenta" }
"ui.statusline.inactive" = { fg = "fg-darker", bg = "bg-dark" }
"ui.popup" = { bg = "bg-float" }
"ui.popup.info" = { fg = "cyan" }
"ui.window" = { fg = "border" }
"ui.help" = { fg = "fg", bg = "bg-dark" }
"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "fg", modifiers = ["bold"] }
"ui.virtual" = { fg = "fg-gutter" }
"ui.virtual.ruler" = { bg = "bg-highlight" }
"ui.virtual.inlay" = { fg = "fg-gutter", modifiers = ["italic"] }
"ui.virtual.indent-guide" = { fg = "border" }
"ui.virtual.whitespace" = { fg = "fg-gutter" }
"ui.menu" = { fg = "fg", bg = "bg-float" }
"ui.menu.selected" = { fg = "cyan", bg = "selection", modifiers = ["bold"] }
"ui.menu.scroll" = { fg = "fg-gutter", bg = "bg-dark" }
"ui.menu.scroll.selected" = { fg = "magenta", bg = "bg-dark" }
"ui.message" = { fg = "fg", bg = "bg-dark" }
"ui.message.error" = { fg = "soft-magenta", bg = "bg-dark" }
"ui.message.warning" = { fg = "yellow", bg = "bg-dark" }
"ui.message.info" = { fg = "cyan", bg = "bg-dark" }
"ui.message.hint" = { fg = "green", bg = "bg-dark" }


# Syntax highlighting
"constant" = { fg = "yellow" }
"constant.builtin" = { fg = "yellow" }
"constant.character" = { fg = "soft-magenta" }
"constant.character.escape" = { fg = "cyan" }
"string" = { fg = "soft-magenta", modifiers = ["italic"] }
"string.regexp" = { fg = "cyan" }
"string.special" = { fg = "cyan" }
"number" = { fg = "yellow" }
"variable" = { fg = "fg" }
"variable.builtin" = { fg = "cyan" }
"variable.parameter" = { fg = "fg", modifiers = ["italic"] }
"variable.other.member" = { fg = "fg" }
"type" = { fg = "purple", modifiers = ["italic"] }
"type.builtin" = { fg = "purple", modifiers = ["italic"] }
"type.enum.variant" = { fg = "purple" }
"constructor" = { fg = "purple" }
"function" = { fg = "cyan" }
"function.builtin" = { fg = "cyan" }
"function.macro" = { fg = "magenta" }
"function.method" = { fg = "cyan" }
"function.method.call" = { fg = "cyan" }
"function.special" = { fg = "magenta" }
"keyword" = { fg = "magenta", modifiers = ["italic", "bold"] }
"keyword.control" = { fg = "magenta", modifiers = ["italic", "bold"] }
"keyword.control.conditional" = { fg = "magenta", modifiers = [
    "italic",
    "bold",
] }
"keyword.control.repeat" = { fg = "magenta", modifiers = ["italic", "bold"] }
"keyword.control.import" = { fg = "magenta", modifiers = ["italic", "bold"] }
"keyword.control.return" = { fg = "magenta", modifiers = ["italic", "bold"] }
"keyword.control.exception" = { fg = "magenta", modifiers = ["italic", "bold"] }
"keyword.operator" = { fg = "magenta" }
"keyword.directive" = { fg = "magenta", modifiers = ["bold"] }
"keyword.function" = { fg = "magenta", modifiers = ["italic", "bold"] }
"operator" = { fg = "magenta" }
"punctuation" = { fg = "fg" }
"punctuation.bracket" = { fg = "fg" }
"punctuation.delimiter" = { fg = "fg" }
"punctuation.special" = { fg = "magenta" }
"tag" = { fg = "red" }
"attribute" = { fg = "yellow" }
"namespace" = { fg = "purple" }
"module" = { fg = "purple" }
"special" = { fg = "magenta" }

# Markup
"markup.heading" = { fg = "magenta", modifiers = ["bold"] }
"markup.heading.marker" = { fg = "magenta" }
"markup.list" = { fg = "magenta" }
"markup.list.numbered" = { fg = "magenta" }
"markup.list.unnumbered" = { fg = "magenta" }
"markup.list.checked" = { fg = "green" }
"markup.list.unchecked" = { fg = "fg-gutter" }
"markup.bold" = { fg = "yellow", modifiers = ["bold"] }
"markup.italic" = { fg = "purple", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "cyan", modifiers = ["underlined"] }
"markup.link.text" = { fg = "cyan" }
"markup.quote" = { fg = "yellow" }
"markup.raw" = { fg = "green" }
"markup.raw.block" = { fg = "fg", bg = "bg-dark" }

# Diff
"diff.plus" = { fg = "green" }
"diff.minus" = { fg = "red" }
"diff.delta" = { fg = "yellow" }

# Diagnostic
"diagnostic" = { modifiers = ["underlined"] }
"diagnostic.hint" = { fg = "green", modifiers = ["underlined"] }
"diagnostic.info" = { fg = "cyan", modifiers = ["underlined"] }
"diagnostic.warning" = { fg = "yellow", modifiers = ["underlined"] }
"diagnostic.error" = { fg = "red", modifiers = ["underlined"] }

# LSP
"ui.cursor.word" = { fg = "bg", bg = "magenta" }
"ui.cursor.word.match" = { fg = "bg", bg = "cyan" }
