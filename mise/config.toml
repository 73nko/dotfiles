# mise como UNICO gestor de toolchains (consolidacion 2026-06).
# Antes: brew (python/openjdk/deno/pnpm) + go install + cargo install + uv,
# cinco gestores sin pinning por proyecto. Ahora todo converge aqui;
# los proyectos pueden sobreescribir con su propio mise.toml/.tool-versions.
# Rust queda en rustup (deliberado: rustaceanvim/cargo-update ya lo asumen).
# Aplicar: `mise install` (o `up-mac`, setup.sh lo lanza).

[tools]
# --- Runtimes (antes en brew) ---
node = "lts"
go = "latest"
python = "3.14"
java = "26" # fuzzy: resuelve el ultimo openjdk; pinear si un proyecto lo exige
deno = "latest"
pnpm = "latest"
# corepack NO migrado: viene incluido con node.

# --- Go tools (antes seccion `go` del Brewfile) ---
# golangci-lint y dlv tambien los instala mason para nvim; estos son los del
# PATH de shell. Duplicidad conocida y aceptada.
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/abice/go-enum" = "latest"
"go:github.com/Gelio/go-global-update" = "latest"
"go:github.com/twpayne/go-jsonstruct/v3/cmd/gojsonstruct" = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:github.com/fatih/gomodifytags" = "latest"
"go:github.com/abenz1267/gomvp" = "latest"
"go:golang.org/x/tools/cmd/gonew" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/cweill/gotests/gotests" = "latest"
"go:gotest.tools/gotestsum" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:github.com/koron/iferr" = "latest"

# --- Cargo tools (antes seccion `cargo` del Brewfile) ---
"cargo:cargo-generate" = "latest"
"cargo:cargo-update" = "latest"
# No esta en crates.io (proyecto git-only): se instala desde el repo.
"cargo:https://github.com/estin/simple-completion-language-server" = "branch:main"

# --- Python tools (antes seccion `uv` del Brewfile) ---
"pipx:nano-pdf" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
pipx.uvx = true # pipx backend usa uv (instalado via brew)
