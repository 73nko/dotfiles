<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neovim Cheatsheet</title>
<style>
:root {
  /* Violet Hour · Glass Splash - mapping a los nombres legacy del cheatsheet.
     Nombres viejos (purple/cyan/pink/green/yellow/orange) se mantienen
     para no tocar el JS: cada workflow y seccion elige su acento
     por nombre legacy pero los valores son del palette Violet Hour. */
  --bg:       #0D0D2C;  /* Dusk */
  --bg2:      #14123A;  /* bg_alt */
  --card:     #14123A;  /* bg_alt */
  --card-h:   #1A1745;  /* plum elevated */
  --border:   #211E45;  /* pane_border warm */
  --purple:   #D6C8FF;  /* magenta_hi - accent primario */
  --cyan:     #A8C9FF;  /* turquoise_hi - active/focus */
  --pink:     #B39DFF;  /* magenta - high emphasis */
  --green:    #B9E0FF;  /* aqua - success cool (no verde, per guide) */
  --yellow:   #F0D2FF;  /* gold */
  --orange:   #E2BCFF;  /* tangerine */
  --text:     #ECE6FF;  /* rosegold */
  --muted:    #777494;  /* rosegold muted */
  --muted2:   #67618B;  /* punct brown */
  --kbd:      #2F365A;  /* branch_bg - pool cool */
  --kbd-b:    #434F76;  /* pane_active */
  --r:        10px;
  --r-sm:     6px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  background-image: radial-gradient(ellipse 120% 80% at 92% 110%, rgba(201,90,74,.18) 0%, rgba(58,21,80,.22) 28%, transparent 62%),
                    radial-gradient(ellipse 70% 60% at 8% -10%, rgba(13,72,88,.22) 0%, transparent 55%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh; overflow-x: hidden;
}

/* ─── HEADER ────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(26,10,40,.85); backdrop-filter: blur(24px) saturate(1.4);
  border-bottom: 1px solid rgba(51,17,39,.6);
  padding: .85rem 1.75rem;
  display: flex; align-items: center; gap: 1.25rem;
}
.logo {
  font-size: 1rem; font-weight: 700; white-space: nowrap;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo span { font-weight: 300; opacity: .6; }
.search-wrap { flex: 1; max-width: 540px; position: relative; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted2); pointer-events: none; }
#search {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 9px 12px 9px 36px;
  color: var(--text); font-size: .85rem; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
#search:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(179,157,255,.18); }
#search::placeholder { color: var(--muted2); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: .75rem; }
#count { font-size: .72rem; color: var(--muted2); white-space: nowrap; }
.kbd-hint { display: flex; align-items: center; gap: .3rem; font-size: .72rem; color: var(--muted); }

/* ─── LAYOUT ────────────────────────────────── */
.layout { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 57px); }

/* ─── SIDEBAR ───────────────────────────────── */
nav { border-right: 1px solid var(--border); padding: 1.25rem .75rem; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; }
nav::-webkit-scrollbar { width: 3px; }
nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.nav-label { font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: .75rem .6rem .2rem; }
.nav-item {
  display: flex; align-items: center; gap: .5rem;
  padding: .38rem .6rem; border-radius: var(--r-sm);
  font-size: .78rem; color: var(--muted2); cursor: pointer;
  transition: all .15s; text-decoration: none; width: 100%; border: none; background: none; text-align: left;
}
.nav-item:hover { color: var(--text); background: rgba(236,230,255,.06); }
.nav-item.active { color: var(--cyan); background: rgba(168,201,255,.12); border-left: 2px solid var(--pink); padding-left: calc(.6rem - 2px); }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* ─── MAIN ──────────────────────────────────── */
main { padding: 1.75rem 2rem; }
.section { margin-bottom: 3rem; scroll-margin-top: 70px; }
.section-hd {
  display: flex; align-items: center; gap: .6rem;
  margin-bottom: 1.1rem; padding-bottom: .7rem;
  border-bottom: 1px solid var(--border);
}
.section-icon { font-size: 1rem; }
.section-title { font-size: .92rem; font-weight: 700; color: var(--yellow); letter-spacing: .01em; }
.section-badge {
  margin-left: auto; font-size: .65rem; color: var(--muted2);
  background: var(--card); border: 1px solid var(--border);
  padding: 1px 8px; border-radius: 20px;
}

/* ─── KBD ───────────────────────────────────── */
kbd {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--kbd); border: 1px solid var(--kbd-b);
  border-bottom-width: 2px; border-radius: 5px;
  padding: 2px 7px; font-family: 'Monaspace Neon','JetBrainsMono Nerd Font','SF Mono','Fira Code','Cascadia Code',monospace;
  font-size: .7rem; color: var(--cyan); white-space: nowrap; line-height: 1.6;
  transition: background .15s, border-color .15s, color .15s;
  box-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.card:hover kbd { background: #434F76; border-color: #A8C9FF; color: #D4F0FF; }

/* ─── SHORTCUT CARDS ────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: .5rem; }
.card {
  --cc: var(--purple);
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: .75rem .9rem;
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
}
.card::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--cc); opacity: 0; transition: opacity .2s;
}
.card:hover { border-color: color-mix(in srgb, var(--cc) 50%, transparent); background: var(--card-h); transform: translateY(-1px); box-shadow: 0 4px 24px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--cc) 8%, transparent); }
.card:hover::after { opacity: 1; }
.card:active { transform: translateY(0); }
.card-desc { font-size: .78rem; color: var(--text); flex: 1; line-height: 1.45; }
.card-desc .tip { display: block; font-size: .67rem; color: var(--muted2); margin-top: 2px; }
.keys { display: flex; align-items: center; gap: 2px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 170px; }
.keys .sep { font-size: .65rem; color: var(--muted); padding: 0 1px; }

/* ─── WORKFLOW CARDS ────────────────────────── */
.workflows { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: .9rem; }
.wf {
  --cc: var(--purple);
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 1.1rem 1.2rem;
  transition: all .25s; border-top: 2px solid var(--cc);
}
.wf:hover { box-shadow: 0 8px 32px rgba(0,0,0,.5); transform: translateY(-2px); }
.wf-title { font-size: .8rem; font-weight: 700; color: var(--cc); margin-bottom: .7rem; display: flex; align-items: center; gap: .4rem; }
.wf-steps { display: flex; flex-direction: column; gap: .45rem; }
.wf-step { display: flex; align-items: baseline; gap: .6rem; font-size: .75rem; line-height: 1.5; }
.wf-num {
  min-width: 17px; height: 17px; border-radius: 50%;
  background: rgba(255,184,213,.14); border: 1px solid rgba(255,184,213,.32);
  color: var(--cc, var(--purple)); font-size: .6rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.wf-text { color: var(--text); flex: 1; }
.wf-text kbd { margin: 0 1px; }
.wf-note { color: var(--muted2); font-size: .68rem; display: block; margin-top: 1px; }

/* ─── COPY TOAST ─────────────────────────────── */
#toast {
  position: fixed; bottom: 2rem; left: 50%; z-index: 999;
  background: linear-gradient(135deg, var(--pink), var(--orange)); color: #0D0D2C;
  padding: .5rem 1.2rem; border-radius: 20px;
  font-size: .75rem; font-weight: 700;
  box-shadow: 0 8px 32px rgba(179,157,255,.35), 0 0 0 1px rgba(226,188,255,.2);
  transform: translateX(-50%) translateY(80px);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ─── EMPTY STATE ────────────────────────────── */
#empty { display: none; text-align: center; padding: 5rem 2rem; color: var(--muted2); }
#empty .e-icon { font-size: 2.5rem; margin-bottom: 1rem; }
#empty p { font-size: .9rem; }

/* ─── HIDDEN ────────────────────────────────── */
.hidden { display: none !important; }

/* ─── SCROLLBAR ──────────────────────────────── */
main::-webkit-scrollbar { width: 5px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ─── RESPONSIVE ─────────────────────────────── */
@media (max-width: 700px) {
  .layout { grid-template-columns: 1fr; }
  nav { display: none; }
  main { padding: 1rem; }
  .workflows, .cards { grid-template-columns: 1fr; }
}
</style>
</head>

// ─── RENDER HELPERS ───────────────────────────────────────────────────

const colorVar = c => c === 'muted' ? 'var(--muted2)' : `var(--${c || 'purple'})`;

function renderKeys(str) {
  // Split on " / " for alternatives
  const alts = str.split(' / ');
  return alts.map((alt, i) => {
    const tokens = alt.match(/<[^>]+>|[^\s]+/g) || [alt];
    const kbds = tokens.map(t => `<kbd>${esc(t)}</kbd>`).join('');
    return (i < alts.length - 1) ? kbds + '<span class="sep">/</span>' : kbds;
  }).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCard(desc, keysStr, tip, color) {
  const raw = (desc + ' ' + keysStr).toLowerCase();
  return `<div class="card" style="--cc:${colorVar(color)}" data-raw="${esc(raw)}" data-copy="${esc(keysStr)}" onclick="copy(this)">
    <span class="card-desc">${esc(desc)}${tip ? `<span class="tip">${esc(tip)}</span>` : ''}</span>
    <span class="keys">${renderKeys(keysStr)}</span>
  </div>`;
}

function renderWfStep(step) {
  const num = '';
  let content = '';
  if (step.keys) {
    content = `${renderKeys(step.keys)} <span style="color:var(--muted2);margin:0 4px">→</span> ${esc(step.text)}`;
  } else {
    content = `<kbd>${esc(step.text)}</kbd>`;
  }
  if (step.note) content += `<span class="wf-note">${esc(step.note)}</span>`;
  return `<div class="wf-step"><div class="wf-num"></div><div class="wf-text">${content}</div></div>`;
}

// ─── BUILD DOM ────────────────────────────────────────────────────────

function build() {
  const main = document.getElementById('main');
  const nav  = document.getElementById('nav');
  let mainHtml = '';
  let navHtml  = '<div class="nav-label">Flujos</div>';

  // Workflows section
  navHtml += `<button class="nav-item" onclick="goto('workflows')"><span class="nav-dot" style="background:var(--purple)"></span>Daily Workflows</button>`;
  mainHtml += `<div class="section" id="workflows">
    <div class="section-hd">
      <span class="section-icon">⚡</span>
      <span class="section-title">Daily Workflows</span>
      <span class="section-badge">${WORKFLOWS.length} flujos</span>
    </div>
    <div class="workflows" id="wf-grid">`;
  WORKFLOWS.forEach(w => {
    mainHtml += `<div class="wf" style="--cc:${colorVar(w.color)}">
      <div class="wf-title">${w.icon} ${esc(w.title)}</div>
      <div class="wf-steps">${w.steps.map(renderWfStep).join('')}</div>
    </div>`;
  });
  mainHtml += '</div></div>';

  // Shortcut sections
  navHtml += '<div class="nav-label" style="margin-top:.75rem">Referencia</div>';
  SECTIONS.forEach(s => {
    const color = colorVar(s.color);
    navHtml += `<button class="nav-item" onclick="goto('${s.id}')"><span class="nav-dot" style="background:${color}"></span>${esc(s.title)}</button>`;
    mainHtml += `<div class="section" id="${s.id}">
      <div class="section-hd">
        <span class="section-icon">${s.icon}</span>
        <span class="section-title">${esc(s.title)}</span>
        <span class="section-badge">${s.items.length}</span>
      </div>
      <div class="cards">
        ${s.items.map(([d, k, t]) => renderCard(d, k, t, s.color)).join('')}
      </div>
    </div>`;
  });

  nav.innerHTML = navHtml;
  main.insertAdjacentHTML('afterbegin', mainHtml);
  updateCount();
}

// ─── SEARCH ───────────────────────────────────────────────────────────

function search(q) {
  q = q.trim().toLowerCase();
  const cards = document.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(c => {
    const raw = c.dataset.raw || '';
    const show = !q || raw.includes(q);
    c.classList.toggle('hidden', !show);
    if (show) visible++;
  });

  // Workflows: hide if no query or query doesn't match any step text
  const wfs = document.querySelectorAll('.wf');
  wfs.forEach(wf => {
    const text = wf.textContent.toLowerCase();
    wf.classList.toggle('hidden', !!q && !text.includes(q));
  });

  // Sections: hide section if all cards hidden
  document.querySelectorAll('.section').forEach(sec => {
    const anyVisible = [...sec.querySelectorAll('.card, .wf')].some(c => !c.classList.contains('hidden'));
    sec.classList.toggle('hidden', !!q && !anyVisible);
  });

  document.getElementById('empty').style.display = (q && visible === 0) ? 'block' : 'none';
  updateCount(q ? visible : null);
}

function updateCount(n) {
  const total = document.querySelectorAll('.card').length;
  document.getElementById('count').textContent = n !== null && n !== undefined
    ? `${n} resultado${n !== 1 ? 's' : ''}`
    : `${total} shortcuts`;
}

// ─── COPY ─────────────────────────────────────────────────────────────

let toastTimer;
function copy(card) {
  const text = card.dataset.copy;
  if (!text) return;
  navigator.clipboard.writeText(text).catch(() => {});
  const toast = document.getElementById('toast');
  toast.textContent = `Copiado: ${text}`;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ─── SCROLL SPY ──────────────────────────────────────────────────────

function goto(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const active = document.querySelector(`.nav-item[onclick="goto('${e.target.id}')"]`);
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -75% 0px' });

// ─── SEARCH SHORTCUT (/) ──────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    const s = document.getElementById('search');
    s.blur(); s.value = ''; search('');
  }
});

document.getElementById('search').addEventListener('input', e => search(e.target.value));

// ─── INIT ─────────────────────────────────────────────────────────────

build();
document.querySelectorAll('.section').forEach(s => observer.observe(s));
</script>
