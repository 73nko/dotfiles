# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-shell "/opt/homebrew/bin/fish"

# Prefix key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split windows
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize panes (uppercase to avoid collision with vim-tmux-navigator)
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -r H resize-pane -L 10
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Copy mode (vim-style) — OSC 52 passthrough via Ghostty
set-option -g set-clipboard on
set-option -g allow-passthrough on
bind -T prefix [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel

# Performance
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Window/Pane numbering
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Lazygit popup (replaces tmux-neolazygit plugin)
bind g display-popup -w 80% -h 80% -E "lazygit"

# Session switcher (tmux-sessionx)
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# Neon Nocturne Theme (The Luminous Editor design system)
# Boundaries via background shifts, not borders
set -g mode-style "fg=#81d4fa,bg=#1b2028"
set -g message-style "fg=#81d4fa,bg=#0f141a"
set -g message-command-style "fg=#55aacf,bg=#0f141a"
set -g window-style "default"
set -g window-active-style "default"
set -g pane-border-style "fg=#151a21"
set -g pane-active-border-style "fg=#55aacf"

# Status bar — surface-container-lowest base, no solid lines
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#f1f3fc,bg=#000000"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#00485e,bg=#81d4fa,bold] #S #[fg=#81d4fa,bg=#000000,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#0f141a,bg=#000000,nobold,nounderscore,noitalics]#[fg=#55aacf,bg=#0f141a] %Y-%m-%d  %H:%M #[fg=#81d4fa,bg=#0f141a,nobold,nounderscore,noitalics]#[fg=#00485e,bg=#81d4fa,bold] #h "

setw -g window-status-activity-style "underscore,fg=#3d4f6e,bg=#000000"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#3d4f6e,bg=#000000"
setw -g window-status-format "#[fg=#000000,bg=#000000,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#000000,bg=#000000,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#000000,bg=#0f141a,nobold,nounderscore,noitalics]#[fg=#81d4fa,bg=#0f141a,bold] #I  #W #F #[fg=#0f141a,bg=#000000,nobold,nounderscore,noitalics]"

set -g @prefix_highlight_output_prefix "#[fg=#81d4fa]#[bg=#000000]#[fg=#00485e]#[bg=#81d4fa]"
set -g @prefix_highlight_output_suffix ""

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
