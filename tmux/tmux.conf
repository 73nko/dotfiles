# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Extended keys (tmux 3.2+) - sin esto, Shift+Enter, Ctrl+;, y otras combos
# que requieren encoding CSI u no llegan a las apps dentro de tmux.
# `always` fuerza el envio aunque tmux no detecte la capacidad en el outer term.
# Necesario reiniciar el server (tmux kill-server) tras el cambio.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Ghostty soporta RGB, extkeys y hyperlinks - se lo decimos explicitamente.
set -as terminal-features 'xterm-ghostty:RGB:extkeys:hyperlinks'

# Use the user's default shell (works on both Intel and Apple Silicon)
set -g default-shell "$SHELL"

# Prefix key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split windows
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New window hereda el directorio del pane actual (coherente con los splits;
# el default abria en el dir donde nacio la sesion)
bind c new-window -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize panes (prefix + HJKL para saltos grandes de 10; Alt-hjkl via
# smart-splits hace el ajuste fino de 3 sin prefijo)
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -r H resize-pane -L 10
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Copy mode (vim-style) — OSC 52 passthrough via Ghostty
setw -g mode-keys vi
set -g status-keys vi
set-option -g set-clipboard on
set-option -g allow-passthrough on
bind -T prefix [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel

# Performance
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Al matar una sesion, salta a la siguiente en vez de hacer detach.
# Con el flujo multi-sesion de sessionx, detach era friccion pura.
set -g detach-on-destroy off

# La status bar solo muestra bateria/fecha/hora: refrescar cada 15s (default)
# era despertar pmset el doble de lo necesario.
set -g status-interval 30

# Window/Pane numbering
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
# smart-splits reemplaza a vim-tmux-navigator (2026-06): deteccion por
# @pane-is-vim (variable que setea el plugin nvim, mas fiable que grep de ps)
# y añade resize ademas de la navegacion Ctrl-hjkl.
set -g @plugin 'mrjones2014/smart-splits.nvim'
# Resize en Ctrl-Alt (NO Alt a secas): AeroSpace posee alt-hjkl a nivel macOS
# para focus de ventanas. El contrato de modificadores del ecosistema:
#   alt        = ventanas (AeroSpace)   ctrl      = panes/splits (navegar)
#   ctrl-alt   = panes/splits (resize)  prefix    = tmux
set -g @smart-splits_resize_left_key  'C-M-h'
set -g @smart-splits_resize_down_key  'C-M-j'
set -g @smart-splits_resize_up_key    'C-M-k'
set -g @smart-splits_resize_right_key 'C-M-l'
# Persist layouts and pane working directories across tmux restarts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'omerxx/tmux-sessionx'

set -g popup-border-lines rounded
set -g popup-border-style "fg=#22b8f5"
set -g popup-style "fg=#f3faf7,bg=#0d3547"

# Lazygit popup (replaces tmux-neolazygit plugin)
bind g display-popup -w 80% -h 80% -E "lazygit"

# git orchard — multi-repo view (fzf picker with preview; Enter opens lazygit)
# Without an argument uses $ORCHARD_ROOT (default ~/dev in git-orchard.sh).
# To target a different root, set the env var in your shell or override the
# bind from personal/tmux/*.conf.
bind G display-popup -w 90% -h 85% -E "~/.config/scripts/git-orchard.sh --pick"

# Scratch terminal — throwaway popup for quick commands without breaking layout
# (same pattern as lazygit/orchard; inherits the current pane's dir)
bind t display-popup -w 70% -h 70% -d "#{pane_current_path}" -E "fish"

# Session switcher (tmux-sessionx)
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
# Incluye resultados de zoxide en el picker: salta a sesiones que aun no
# existen tecleando el directorio (se crea la sesion al vuelo)
set -g @sessionx-zoxide-mode 'on'

# ============================================
# Violet Hour · Glass theme (guide v2 §05)
# Deep indigo, flat segments (no powerline arrows), cool-when-active panes.
# ============================================

# Mode / message
set -g mode-style "fg=#062230,bg=#7fe0ff,bold"
set -g message-style "fg=#f3faf7,bg=#0d3547"
set -g message-command-style "fg=#a8ecff,bg=#0d3547"

# Pane borders - cool-when-active, violet-when-idle
set -g pane-border-style "fg=#113e51"
set -g pane-active-border-style "fg=#7fe0ff"
set -g display-panes-colour "#22b8f5"
set -g display-panes-active-colour "#7fe0ff"

# Clock mode tint
set -g clock-mode-colour "#22b8f5"
set -g clock-mode-style 24

# Status bar - bottom, height 1, night background
set -g status "on"
set -g status-position bottom
set -g status-justify "left"
set -g status-style "fg=#f3faf7,bg=#062230"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Session segment (izquierda): orchid bg + night fg, tmux glyph, flat (sin arrows)
# Con prefix pulsado, el segmento de sesion cambia de orchid a ice: indicador
# visual nativo via #{?client_prefix,...}. Sustituye a tmux-prefix-highlight,
# cuyas opciones @prefix_highlight_* estaban en este fichero SIN el plugin
# instalado (config muerta, eliminada 2026-06).
set -g status-left "#[fg=#062230,bg=#{?client_prefix,#7fe0ff,#22b8f5},bold]  #S #[fg=#{?client_prefix,#7fe0ff,#22b8f5},bg=#062230,nobold] "

# Right: battery (lilac glyph + pct), fecha (silver muted), clock periwinkle/night bold
set -g status-right "#[fg=#a8ecff,bg=#062230]  #(pmset -g batt | grep -Eo '\\d+%%' | head -1) #[fg=#839b9e,bg=#062230] %Y-%m-%d #[fg=#062230,bg=#5f9bd8,bold] %H:%M "

# Window list
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#5ff2cf,bg=#062230"
setw -g window-status-bell-style "fg=#22b8f5,bg=#062230,bold"

# Inactive window: silver 58%
setw -g window-status-style "fg=#839b9e,bg=#062230"
setw -g window-status-format "#[fg=#839b9e,bg=#062230] #I #W "

# Active window: ice .22 bg + ice fg, bloom dot marker
setw -g window-status-current-style "fg=#7fe0ff,bg=#214c5e,bold"
setw -g window-status-current-format "#[fg=#7fe0ff,bg=#214c5e,bold] #I #W #[fg=#e0fbff]● #[fg=#214c5e,bg=#062230]"

# ============================================
# Personal layer (gitignored in the public repo).
# User-specific bindings load here if the directory exists.
# See ~/.config/personal/README.md.
# ============================================
run-shell 'for file in "$HOME"/.config/personal/tmux/*.conf; do [ -f "$file" ] && tmux source-file "$file"; done'

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
