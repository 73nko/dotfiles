set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind \\ split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind j resize-pane -D 10
bind k resize-pane -U 10
bind l resize-pane -R 10
bind h resize-pane -L 10

bind -r m resize-pane -Z

set -g mouse on
set-option -g set-clipboard off
bind -T prefix [ copy-mode
# Use 'v' to begin selection (vim-style)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Paste with p (from system clipboard)
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"


# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'fabioluciano/tmux-tokyo-night'


set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


# Tokyo Night Theme - Neon Magenta/Cyan Accents
set -g mode-style "fg=#00ffff,bg=#2f0e3b"  # Cyan text on dark purple

set -g message-style "fg=#ff00ff,bg=#2f0e3b"  # Neon magenta messages
set -g message-command-style "fg=#00ffff,bg=#2f0e3b"  # Cyan command messages

set -g pane-border-style "fg=#2f0e3b"  # Dark purple borders
set -g pane-active-border-style "fg=#ff00ff"  # Neon magenta active border

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#c0caf5,bg=#090a10"  # Light purple text on deep black

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#0d0f18,bg=#ff00ff,bold] #S #[fg=#ff00ff,bg=#090a10,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#090a10,bg=#090a10,nobold,nounderscore,noitalics]#[fg=#00ffff,bg=#090a10] #{prefix_highlight} #[fg=#2f0e3b,bg=#090a10,nobold,nounderscore,noitalics]#[fg=#00ffff,bg=#2f0e3b] %Y-%m-%d  %I:%M %p #[fg=#00ffff,bg=#2f0e3b,nobold,nounderscore,noitalics]#[fg=#0d0f18,bg=#00ffff,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#090a10,bg=#090a10,nobold,nounderscore,noitalics]#[fg=#00ffff,bg=#090a10] #{prefix_highlight} #[fg=#2f0e3b,bg=#090a10,nobold,nounderscore,noitalics]#[fg=#00ffff,bg=#2f0e3b] %Y-%m-%d  %H:%M #[fg=#00ffff,bg=#2f0e3b,nobold,nounderscore,noitalics]#[fg=#0d0f18,bg=#00ffff,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#565f89,bg=#090a10"  # Dimmed purple for activity
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#565f89,bg=#090a10"  # Dimmed purple for inactive windows
setw -g window-status-format "#[fg=#090a10,bg=#090a10,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#090a10,bg=#090a10,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#090a10,bg=#2f0e3b,nobold,nounderscore,noitalics]#[fg=#ff00ff,bg=#2f0e3b,bold] #I  #W #F #[fg=#2f0e3b,bg=#090a10,nobold,nounderscore,noitalics]"  # Neon magenta for current window

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#ff00ff]#[bg=#090a10]#[fg=#090a10]#[bg=#ff00ff]"
set -g @prefix_highlight_output_suffix ""


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
