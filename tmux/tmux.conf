# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-shell "/opt/homebrew/bin/fish"

# Prefix key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split windows
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize panes
bind j resize-pane -D 10
bind k resize-pane -U 10
bind l resize-pane -R 10
bind h resize-pane -L 10
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Copy mode (vim-style)
set-option -g set-clipboard off
bind -T prefix [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Performance
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Window/Pane numbering
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Nebula Theme
set -g mode-style "fg=#4DD0E1,bg=#1E2235"
set -g message-style "fg=#FF79C6,bg=#1E2235"
set -g message-command-style "fg=#4DD0E1,bg=#1E2235"
set -g pane-border-style "fg=#2A2F4A"
set -g pane-active-border-style "fg=#BD93F9"

# Status bar
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#CDD6F4,bg=#070A13"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#070A13,bg=#BD93F9,bold] #S #[fg=#BD93F9,bg=#070A13,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1E2235,bg=#070A13,nobold,nounderscore,noitalics]#[fg=#4DD0E1,bg=#1E2235] %Y-%m-%d  %H:%M #[fg=#7AB9F5,bg=#1E2235,nobold,nounderscore,noitalics]#[fg=#070A13,bg=#7AB9F5,bold] #h "

setw -g window-status-activity-style "underscore,fg=#4A5480,bg=#070A13"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#4A5480,bg=#070A13"
setw -g window-status-format "#[fg=#070A13,bg=#070A13,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#070A13,bg=#070A13,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#070A13,bg=#1E2235,nobold,nounderscore,noitalics]#[fg=#FF79C6,bg=#1E2235,bold] #I  #W #F #[fg=#1E2235,bg=#070A13,nobold,nounderscore,noitalics]"

set -g @prefix_highlight_output_prefix "#[fg=#FF79C6]#[bg=#070A13]#[fg=#070A13]#[bg=#FF79C6]"
set -g @prefix_highlight_output_suffix ""

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
