# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Use the user's default shell (works on both Intel and Apple Silicon)
set -g default-shell "$SHELL"

# Prefix key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split windows
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize panes (uppercase to avoid collision with vim-tmux-navigator)
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -r H resize-pane -L 10
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Copy mode (vim-style) — OSC 52 passthrough via Ghostty
set-option -g set-clipboard on
set-option -g allow-passthrough on
bind -T prefix [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel

# Performance
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Window/Pane numbering
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Lazygit popup (replaces tmux-neolazygit plugin)
bind g display-popup -w 80% -h 80% -E "lazygit"

# Session switcher (tmux-sessionx)
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# ============================================
# Sunset · Pool Splash theme (§04 style guide)
# Warm dusk background, cool-when-active pane borders.
# ============================================

# Mode / message
set -g mode-style "fg=#1A0A28,bg=#7FE0EB,bold"
set -g message-style "fg=#FFC6A0,bg=#3A1550"
set -g message-command-style "fg=#FFB8D5,bg=#3A1550"

# Pane borders - cool-when-active, warm-when-idle
set -g pane-border-style "fg=#331127"
set -g pane-active-border-style "fg=#7FE0EB"
set -g display-panes-colour "#FF8A3D"
set -g display-panes-active-colour "#7FE0EB"

# Clock mode tint
set -g clock-mode-colour "#FF3D8A"
set -g clock-mode-style 24

# Status bar - bottom, height 1, warm dusk background
set -g status "on"
set -g status-position bottom
set -g status-justify "left"
set -g status-style "fg=#FFC6A0,bg=#1A0A28"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Session segment (izquierda): magenta bg + dusk fg, tmux glyph (nerdfont)
set -g status-left "#[fg=#1A0A28,bg=#FF3D8A,bold]  #S #[fg=#FF3D8A,bg=#1A0A28,nobold,nounderscore,noitalics]"

# Right: battery (gold glyph + pct), fecha (rosegold muted), clock turquoise/dusk bold
set -g status-right "#[fg=#FFD67A,bg=#1A0A28] ⚡ #(pmset -g batt | grep -Eo '\\d+%%' | head -1) #[fg=#A58670,bg=#1A0A28] %Y-%m-%d #[fg=#7FE0EB,bg=#1A0A28,nobold,nounderscore,noitalics]#[fg=#1A0A28,bg=#7FE0EB,bold] %H:%M "

# Window list
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#FF8A3D,bg=#1A0A28"
setw -g window-status-bell-style "fg=#FF3D8A,bg=#1A0A28,bold"

# Inactive window: rosegold .45
setw -g window-status-style "fg=#A58670,bg=#1A0A28"
setw -g window-status-format "#[fg=#A58670,bg=#1A0A28] #I #W "

# Active window: turquoise bg + turquoise_hi fg, gold dot marker
setw -g window-status-current-style "fg=#7FE0EB,bg=#1F3E48,bold"
setw -g window-status-current-format "#[fg=#1A0A28,bg=#1F3E48]#[fg=#7FE0EB,bg=#1F3E48,bold] #I #W #[fg=#FFD67A]●#[fg=#1F3E48,bg=#1A0A28]"

# Prefix highlight (compat)
set -g @prefix_highlight_output_prefix "#[fg=#FF3D8A]#[bg=#1A0A28]#[fg=#1A0A28]#[bg=#FF3D8A]"
set -g @prefix_highlight_output_suffix ""
set -g @prefix_highlight_fg "#1A0A28"
set -g @prefix_highlight_bg "#FF3D8A"
set -g @prefix_highlight_copy_mode_attr "fg=#1A0A28,bg=#FF8A3D,bold"

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
