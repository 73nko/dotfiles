# Terminal settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Extended keys (tmux 3.2+) - sin esto, Shift+Enter, Ctrl+;, y otras combos
# que requieren encoding CSI u no llegan a las apps dentro de tmux.
# `always` fuerza el envio aunque tmux no detecte la capacidad en el outer term.
# Necesario reiniciar el server (tmux kill-server) tras el cambio.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Ghostty soporta RGB, extkeys y hyperlinks - se lo decimos explicitamente.
set -as terminal-features 'xterm-ghostty:RGB:extkeys:hyperlinks'

# Use the user's default shell (works on both Intel and Apple Silicon)
set -g default-shell "$SHELL"

# Prefix key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split windows
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Resize panes (uppercase to avoid collision with vim-tmux-navigator)
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind -r H resize-pane -L 10
bind -r m resize-pane -Z

# Mouse support
set -g mouse on

# Copy mode (vim-style) — OSC 52 passthrough via Ghostty
set-option -g set-clipboard on
set-option -g allow-passthrough on
bind -T prefix [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel

# Performance
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Window/Pane numbering
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Lazygit popup (replaces tmux-neolazygit plugin)
bind g display-popup -w 80% -h 80% -E "lazygit"

# git orchard — vista multi-repo (picker fzf con preview; Enter abre lazygit)
bind G display-popup -w 90% -h 85% -E "~/.config/scripts/git-orchard.sh --pick ~/YOUR-ORG"

# Session switcher (tmux-sessionx)
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# ============================================
# Violet Hour · Glass theme (guide v2 §05)
# Deep indigo, flat segments (no powerline arrows), cool-when-active panes.
# ============================================

# Mode / message
set -g mode-style "fg=#0d0d2c,bg=#a8c9ff,bold"
set -g message-style "fg=#ece6ff,bg=#1a1745"
set -g message-command-style "fg=#d6c8ff,bg=#1a1745"

# Pane borders - cool-when-active, violet-when-idle
set -g pane-border-style "fg=#211e45"
set -g pane-active-border-style "fg=#a8c9ff"
set -g display-panes-colour "#b39dff"
set -g display-panes-active-colour "#a8c9ff"

# Clock mode tint
set -g clock-mode-colour "#b39dff"
set -g clock-mode-style 24

# Status bar - bottom, height 1, night background
set -g status "on"
set -g status-position bottom
set -g status-justify "left"
set -g status-style "fg=#ece6ff,bg=#0d0d2c"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Session segment (izquierda): orchid bg + night fg, tmux glyph, flat (sin arrows)
set -g status-left "#[fg=#0d0d2c,bg=#b39dff,bold]  #S #[fg=#b39dff,bg=#0d0d2c,nobold] "

# Right: battery (lilac glyph + pct), fecha (silver muted), clock periwinkle/night bold
set -g status-right "#[fg=#d6c8ff,bg=#0d0d2c]  #(pmset -g batt | grep -Eo '\\d+%%' | head -1) #[fg=#777494,bg=#0d0d2c] %Y-%m-%d #[fg=#0d0d2c,bg=#8da7ff,bold] %H:%M "

# Window list
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#e2bcff,bg=#0d0d2c"
setw -g window-status-bell-style "fg=#b39dff,bg=#0d0d2c,bold"

# Inactive window: silver 58%
setw -g window-status-style "fg=#777494,bg=#0d0d2c"
setw -g window-status-format "#[fg=#777494,bg=#0d0d2c] #I #W "

# Active window: ice .22 bg + ice fg, bloom dot marker
setw -g window-status-current-style "fg=#a8c9ff,bg=#2f365a,bold"
setw -g window-status-current-format "#[fg=#a8c9ff,bg=#2f365a,bold] #I #W #[fg=#f0d2ff]● #[fg=#2f365a,bg=#0d0d2c]"

# Prefix highlight (compat)
set -g @prefix_highlight_output_prefix "#[fg=#0d0d2c]#[bg=#b39dff]"
set -g @prefix_highlight_output_suffix ""
set -g @prefix_highlight_fg "#0d0d2c"
set -g @prefix_highlight_bg "#b39dff"
set -g @prefix_highlight_copy_mode_attr "fg=#0d0d2c,bg=#e2bcff,bold"

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
