# ============================================================================
# Custom topgrade steps que NO estan auto-detectados por topgrade.
# - fisher, TPM (tmux), lazy.nvim, gh extensions: ya auto-detecta (no duplicar).
# - atuin sync, bat cache rebuild: aqui.
# ============================================================================

[commands]
# Sincroniza el history de atuin con el server. Sin esto, las sesiones de
# distintos equipos divergen. Falla silencioso si no hay conexion.
"Atuin history sync" = "atuin sync 2>/dev/null || true"

# Rebuild del cache de bat para que temas custom (Violet Hour) se
# registren tras updates. Idempotente.
"Bat themes cache" = "command -v bat >/dev/null && bat cache --build >/dev/null 2>&1 || true"

# Update explicito de extensions de gh (por si la auto-deteccion de topgrade
# falla en alguna version). gh extension upgrade es idempotente.
"GitHub CLI extensions" = "command -v gh >/dev/null && gh extension upgrade --all 2>/dev/null || true"

# Update plugins de Neovim en headless. Lazy.nvim suele ser auto-detectado
# pero esto es seguro en caso contrario.
"Neovim plugins" = "command -v nvim >/dev/null && nvim --headless '+Lazy! sync' +qa 2>/dev/null || true"
