# Yazi flavor — Glacier Signal
# Aligned with ~/.config/Styles/Glacier Signal.html
# identity  = signal/glow/mint/frost
# structure = steel/ice/azure
# ground    = night/fjord/snow
# Syntax highlighting in preview pane is delegated to ./tmtheme.xml
# (symlinked to ~/.config/bat/themes/Glacier Signal.tmTheme).

[manager]
cwd = { fg = "#7fe0ff", bold = true }
hovered = { fg = "#062230", bg = "#7fe0ff", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#e0fbff", bold = true, italic = true }
find_position = { fg = "#5ff2cf", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#e0fbff", bg = "#e0fbff" }
marker_cut = { fg = "#5ff2cf", bg = "#5ff2cf" }
marker_marked = { fg = "#7fe0ff", bg = "#7fe0ff" }
marker_selected = { fg = "#a8ecff", bg = "#a8ecff" }

tab_active = { fg = "#062230", bg = "#7fe0ff", bold = true }
tab_inactive = { fg = "#f3faf7", bg = "#0d3547" }

count_copied = { fg = "#062230", bg = "#e0fbff" }
count_cut = { fg = "#062230", bg = "#5ff2cf" }
count_selected = { fg = "#062230", bg = "#7fe0ff" }

border_symbol = "│"
border_style = { fg = "#7fe0ff" }

syntect_theme = "tmtheme.xml"

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#0d3547", bg = "#0d3547" }

mode_normal = { fg = "#062230", bg = "#7fe0ff", bold = true }
mode_select = { fg = "#062230", bg = "#22b8f5", bold = true }
mode_unset = { fg = "#062230", bg = "#e0fbff", bold = true }

progress_label = { fg = "#f3faf7", bold = true }
progress_normal = { fg = "#7fe0ff", bg = "#0d3547" }
progress_error = { fg = "#5ff2cf", bg = "#0d3547" }

permissions_t = { fg = "#7fe0ff" }
permissions_r = { fg = "#e0fbff" }
permissions_w = { fg = "#22b8f5" }
permissions_x = { fg = "#b8f1ff" }
permissions_s = { fg = "#f3faf7" }

[select]
border = { fg = "#7fe0ff" }
active = { fg = "#22b8f5", bold = true }
inactive = {}

[input]
border = { fg = "#7fe0ff" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#7fe0ff" }
active = { bg = "#214c5e" }
inactive = {}

icon_file = { fg = "#f3faf7" }
icon_folder = { fg = "#7fe0ff" }
icon_command = { fg = "#22b8f5" }

[tasks]
border = { fg = "#7fe0ff" }
title = {}
hovered = { underline = true }

[which]
mask = { bg = "#062230" }
cand = { fg = "#7fe0ff" }
rest = { fg = "#f3faf7" }
desc = { fg = "#22b8f5" }
separator = "  "
separator_style = { fg = "#839b9e" }

[help]
on = { fg = "#7fe0ff" }
exec = { fg = "#22b8f5" }
desc = { fg = "#f3faf7" }
hovered = { bg = "#0d3547", bold = true }
footer = { fg = "#062230", bg = "#f3faf7" }

[filetype]
# Yazi 25+ requires `url` (or `mime`/`is`) on every rule. `name` was removed.
# Categorias por color del espectro nuevo (2026-06): el listado se lee de un
# vistazo en vez de ser monocromo. Imagen=teal, video=azure, audio=orange,
# archivo=coral, markup=azure, codigo=gold, exec=green, dir=ice.
rules = [
  # Image
  { mime = "image/*", fg = "#5ff2cf" },
  # Video
  { mime = "video/*", fg = "#b8f1ff" },
  # Audio
  { mime = "audio/*", fg = "#ffd873" },
  # Archive
  { mime = "application/{zip,rar,7z,tar,gzip,xz,zstd,bzip*}", fg = "#ff7a6e" },
  # Markup / data
  { url = "*.{md,markdown,html,xml,yaml,toml,json,csv}", fg = "#b8f1ff" },
  # Code
  { url = "*.{ts,tsx,js,jsx,py,rs,go,c,cpp,h,sh,fish,lua}", fg = "#ffd873" },
  # Hidden
  { url = ".*", fg = "#839b9e" },
  # Executable
  { url = "*", is = "exec", fg = "#8fdc8f" },
  # Directories — ice
  { url = "*/", fg = "#7fe0ff" },
  # Fallback (everything else)
  { url = "*", fg = "#f3faf7" },
]
