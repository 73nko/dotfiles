# Yazi flavor — Violet Hour · Glass
# Aligned with ~/.config/Styles/Violet Hour · Glass.html
# identity  = orchid/lilac/rose-mist/bloom
# structure = periwinkle/ice/cyan-mist
# ground    = night/indigo/star
# Syntax highlighting in preview pane is delegated to ./tmtheme.xml
# (symlinked to ~/.config/bat/themes/Violet Hour.tmTheme).

[manager]
cwd = { fg = "#a8c9ff", bold = true }
hovered = { fg = "#0d0d2c", bg = "#a8c9ff", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#f0d2ff", bold = true, italic = true }
find_position = { fg = "#e2bcff", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#f0d2ff", bg = "#f0d2ff" }
marker_cut = { fg = "#e2bcff", bg = "#e2bcff" }
marker_marked = { fg = "#a8c9ff", bg = "#a8c9ff" }
marker_selected = { fg = "#d6c8ff", bg = "#d6c8ff" }

tab_active = { fg = "#0d0d2c", bg = "#a8c9ff", bold = true }
tab_inactive = { fg = "#ece6ff", bg = "#1a1745" }

count_copied = { fg = "#0d0d2c", bg = "#f0d2ff" }
count_cut = { fg = "#0d0d2c", bg = "#e2bcff" }
count_selected = { fg = "#0d0d2c", bg = "#a8c9ff" }

border_symbol = "│"
border_style = { fg = "#a8c9ff" }

syntect_theme = "tmtheme.xml"

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#1a1745", bg = "#1a1745" }

mode_normal = { fg = "#0d0d2c", bg = "#a8c9ff", bold = true }
mode_select = { fg = "#0d0d2c", bg = "#b39dff", bold = true }
mode_unset = { fg = "#0d0d2c", bg = "#f0d2ff", bold = true }

progress_label = { fg = "#ece6ff", bold = true }
progress_normal = { fg = "#a8c9ff", bg = "#1a1745" }
progress_error = { fg = "#e2bcff", bg = "#1a1745" }

permissions_t = { fg = "#a8c9ff" }
permissions_r = { fg = "#f0d2ff" }
permissions_w = { fg = "#b39dff" }
permissions_x = { fg = "#b9e0ff" }
permissions_s = { fg = "#ece6ff" }

[select]
border = { fg = "#a8c9ff" }
active = { fg = "#b39dff", bold = true }
inactive = {}

[input]
border = { fg = "#a8c9ff" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#a8c9ff" }
active = { bg = "#1a1745" }
inactive = {}

icon_file = { fg = "#ece6ff" }
icon_folder = { fg = "#a8c9ff" }
icon_command = { fg = "#b39dff" }

[tasks]
border = { fg = "#a8c9ff" }
title = {}
hovered = { underline = true }

[which]
mask = { bg = "#0d0d2c" }
cand = { fg = "#a8c9ff" }
rest = { fg = "#ece6ff" }
desc = { fg = "#b39dff" }
separator = "  "
separator_style = { fg = "#777494" }

[help]
on = { fg = "#a8c9ff" }
exec = { fg = "#b39dff" }
desc = { fg = "#ece6ff" }
hovered = { bg = "#1a1745", bold = true }
footer = { fg = "#0d0d2c", bg = "#ece6ff" }

[filetype]
# Yazi 25+ requires `url` (or `mime`/`is`) on every rule. `name` was removed.
rules = [
  # Image
  { mime = "image/*", fg = "#a8c9ff" },
  # Video
  { mime = "video/*", fg = "#b9e0ff" },
  # Audio
  { mime = "audio/*", fg = "#f0d2ff" },
  # Archive
  { mime = "application/{zip,rar,7z,tar,gzip,xz,zstd,bzip*}", fg = "#b39dff" },
  # Code / text
  { url = "*.{md,markdown,html,xml,yaml,toml,json,csv}", fg = "#ece6ff" },
  { url = "*.{ts,tsx,js,jsx,py,rs,go,c,cpp,h,sh,fish,lua}", fg = "#ece6ff" },
  # Hidden
  { url = ".*", fg = "#777494" },
  # Executable
  { url = "*", is = "exec", fg = "#e2bcff" },
  # Directories — ice
  { url = "*/", fg = "#a8c9ff" },
  # Fallback (everything else)
  { url = "*", fg = "#ece6ff" },
]
