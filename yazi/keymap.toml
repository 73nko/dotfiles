# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make sure you're using the latest version of yazi.
# https://github.com/sxyazi/yazi/blob/main/yazi-config/src/keymap/keymap.rs

[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd ~"
desc = "Go home"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = "Go to config"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Desktop"
desc = "Go to Desktop"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd /tmp"
desc = "Go to temporary directory"

[[mgr.prepend_keymap]]
on = ["."]
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = ["T"]
run = "tab_create --current"
desc = "Create a new tab with current path"

[[mgr.prepend_keymap]]
on = ["M"]
run = "plugin max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = ["<C-s>"]
run = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = ["k"]
run = "arrow -1"
desc = "Move cursor up"

[[mgr.prepend_keymap]]
on = ["j"]
run = "arrow 1"
desc = "Move cursor down"

[[mgr.prepend_keymap]]
on = ["l"]
run = "plugin --sync smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["h"]
run = "leave"
desc = "Go back to the parent directory"

[[mgr.prepend_keymap]]
on = ["H"]
run = "back"
desc = "Go back in history"

[[mgr.prepend_keymap]]
on = ["L"]
run = "forward"
desc = "Go forward in history"

# Git integration bindings (basic)
[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "shell 'lazygit' --block --confirm"
desc = "Lazygit"

# Drag and drop (requires compatible terminal)
[[mgr.prepend_keymap]]
on = ["<C-n>"]
run = '''
	shell 'dragon -x -i -T "$1"' --confirm
'''
desc = "Drag and drop"

# Open with specific editors
[[mgr.prepend_keymap]]
on = ["g", "v"]
run = 'shell "code \"$@\"" --orphan'
desc = "Open in VS Code"

[[mgr.prepend_keymap]]
on = ["g", "z"]
run = 'shell "zed \"$@\"" --orphan'
desc = "Open in Zed"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = 'shell "nvim \"$@\"" --block'
desc = "Open in Neovim"
