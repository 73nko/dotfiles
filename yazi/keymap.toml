# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make sure you're using the latest version of yazi.
# https://github.com/sxyazi/yazi/blob/main/yazi-config/src/keymap/keymap.rs

[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd ~"
desc = "Go home"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = "Go to config"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Desktop"
desc = "Go to Desktop"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd /tmp"
desc = "Go to temporary directory"

[[mgr.prepend_keymap]]
on = ["."]
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = ["T"]
run = "tab_create --current"
desc = "Create a new tab with current path"

[[mgr.prepend_keymap]]
on = ["M"]
run = "plugin max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = ["<C-s>"]
run = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

# l overridden to use smart-enter (the rest are Yazi defaults)
[[mgr.prepend_keymap]]
on = ["l"]
run = "plugin --sync smart-enter"
desc = "Enter the child directory, or open the file"

# Git integration bindings (basic)
[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "shell 'lazygit' --block --confirm"
desc = "Lazygit"

# <C-n> drag-and-drop eliminado (2026-06): `dragon` es una herramienta
# Linux/X11, no existe en macOS ni estaba en el Brewfile. Keybind muerto
# desde el dia uno. Alternativa real: `R` (reveal) y arrastrar desde Finder.

# Open with specific editors
# (g,v "Open in VS Code" eliminado 2026-06: VS Code purgado del equipo)
[[mgr.prepend_keymap]]
on = ["g", "z"]
run = 'shell "zed \"$@\"" --orphan'
desc = "Open in Zed"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = 'shell "nvim \"$@\"" --block'
desc = "Open in Neovim"

# Smart filter (fuzzy find in current directory)
[[mgr.prepend_keymap]]
on = ["f"]
run = "plugin smart-filter"
desc = "Smart filter"

# Bookmarks
[[mgr.prepend_keymap]]
on = ["b", "a"]
run = "plugin bookmarks --args=save"
desc = "Save bookmark"

[[mgr.prepend_keymap]]
on = ["b", "g"]
run = "plugin bookmarks --args=jump"
desc = "Jump to bookmark"

[[mgr.prepend_keymap]]
on = ["b", "d"]
run = "plugin bookmarks --args=delete"
desc = "Delete bookmark"

[[mgr.prepend_keymap]]
on = ["b", "D"]
run = "plugin bookmarks --args=delete_all"
desc = "Delete all bookmarks"
