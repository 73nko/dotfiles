[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "lanczos3"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Edit in Neovim" },
    { run = 'code "$@"', orphan = true, desc = "Open in VS Code" },
    { run = 'zed "$@"', orphan = true, desc = "Open in Zed" },
]
open = [{ run = 'open "$@"', desc = "Open" }]
reveal = [{ run = 'open -R "$@"', desc = "Reveal in Finder" }]
extract = [
    { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
    { run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]
play = [
    { run = 'mpv "$@"', orphan = true, for = "unix" },
    { run = 'mpv "%1"', orphan = true, for = "windows" },
    { run = '''mediainfo "$1"; echo "Press enter to exit"; read''', block = true, desc = "Show media info", for = "unix" },
]

[open]
# Yazi 25+: each rule needs `url` (or `mime`/`is`). `name` was removed.
rules = [
    { url = "*/", use = [
        "edit",
        "open",
        "reveal",
    ] },
    { mime = "text/*", use = [
        "edit",
        "reveal",
    ] },
    { mime = "image/*", use = [
        "open",
        "reveal",
    ] },
    { mime = "video/*", use = [
        "play",
        "reveal",
    ] },
    { mime = "audio/*", use = [
        "play",
        "reveal",
    ] },
    { mime = "inode/x-empty", use = [
        "edit",
        "reveal",
    ] },
    { mime = "application/json", use = [
        "edit",
        "reveal",
    ] },
    { mime = "*/*", use = [
        "open",
        "reveal",
    ] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
# Yazi 25+ requires `group` as a string ("files" or "directories").
fetchers = [
    { id = "git", url = "*",  run = "git", group = "files" },
    { id = "git", url = "*/", run = "git", group = "directories" },
]

[input]
# cursor_blink = false

[select]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[log]
enabled = false
